name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: the page must regenerate cleanly
        run: |
          python build_page.py > /tmp/index.html
          diff -q /tmp/index.html docs/index.html
      - name: the shipped examples must still run
        run: |
          python -m plainsign --quiet < examples/ordinary.json
          python -m plainsign --quiet < examples/transfer.json
